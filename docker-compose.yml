services:
  postgres:
    image: postgres:16-alpine
    container_name: vortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex
      POSTGRES_DB: vortex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex -d vortex"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vortex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vortex-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &app-env
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://vortex:vortex@postgres:5432/vortex?schema=public
      CORS_ORIGIN: "*"
      WS_MAX_CONNECTIONS: 1000
      WS_BACKPLANE: memory
      REDIS_URL: redis://redis:6379
      # Issue #494 — single-process default: this service serves the API and
      # runs queue workers. With the in-memory intents store the store-size
      # job must run here, next to the data it evicts.
      PROCESS_ROLE: all
      JOBS_DRIVER: bullmq
      FLAGS_PUBSUB: redis
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:-}
      CANARY_ADDRESSES: ${CANARY_ADDRESSES:-}
    ports:
      - "4000:4000"
    volumes:
      - .:/app
    command: sh -c "npx prisma migrate deploy && npm run dev -- --host 0.0.0.0"

  # Extra horizontally-scaled job worker: `docker compose --profile worker up`.
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vortex-worker
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      PROCESS_ROLE: worker
      PORT: 4001
    volumes:
      - .:/app
    # Migrations are run by the app service.
    command: npm run dev

volumes:
  postgres-data:
