name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerability-scan:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm audit --audit-level=high

  license-scan:
    name: Dependency License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Permissive-only allow-list, reconciled with the project's own
      # MIT/Apache-2.0 license (issue #107). Fails the build on any
      # dependency (direct or transitive) carrying a copyleft or
      # unrecognized/unlicensed license.
      - name: Check dependency licenses
        run: |
          npx license-checker --production \
            --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense' \
            --excludePrivatePackages

  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    # Only meaningful on PRs — on direct pushes to main we skip this check
    # since squash merges are handled by the branch protection rule.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          # Fetch enough history to validate all commits in the PR.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint every commit in the PR from the merge base to HEAD.
      - name: Lint commit messages
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to   ${{ github.event.pull_request.head.sha }} \
            --verbose

  backend:
    # The en dash in the name is not cosmetic: branch protection stores the
    # exact check name as a string, so replacing it with a hyphen renames a
    # required check and blocks every PR until an admin edits the rule.
    name: Backend (Nest) – Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    # Spin up a PostgreSQL service container so Prisma can connect during the
    # migrate step (migrate deploy requires a live DB).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex
          POSTGRES_DB: vortex
        ports:
          - 5432:5432
        # Wait until postgres is healthy before the steps run.
        options: >-
          --health-cmd="pg_isready -U vortex"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://vortex:vortex@localhost:5432/vortex?schema=public

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      # ── Node / npm cache (#130) ──────────────────────────────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Env drift check ────────────────────────────────────────────────────
      # Fast, early-failing check that env.validation.ts, .env*.example, and
      # configuration.ts's process.env reads all agree on the same variable set.
      - name: Check env var drift
        run: npx tsx scripts/check-env-drift.ts

      # ── Prisma ──────────────────────────────────────────────────────────────
      - name: Validate Prisma schema
        run: npm run db:validate

      # `npm ci` deletes node_modules, so the generated client has to be cached
      # *after* the install, not before. The key includes package-lock.json as
      # well as the schema: the client is also regenerated when the Prisma
      # version moves, and a client generated by a different version fails at
      # runtime rather than at generate time.
      - name: Restore cached Prisma client
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules/.prisma
          key: prisma-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('prisma/schema.prisma', 'package-lock.json') }}

      - name: Generate Prisma client
        run: npm run db:generate

      # Apply all pending migrations to the CI database so the schema stays in
      # sync and any broken migration SQL is caught before merge.
      - name: Run database migrations
        run: npm run db:migrate:prod

      # ── Build & static checks ──────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # dist/ is keyed on everything tsc reads, so a hit means the restored
      # output is what this commit's build would produce anyway. There is
      # deliberately no restore-keys prefix fallback: a partially-restored
      # dist/ from a different commit is exactly the stale-artifact bug this
      # cache must not be able to introduce.
      - name: Restore cached build output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: dist
          key: dist-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('src/**/*.ts', 'package.json', 'tsconfig.json', 'nest-cli.json') }}

      - name: Build
        run: npm run build

      # Unit and E2E tests deliberately do NOT run here. They are sharded into
      # the `unit-tests`, `e2e-tests` and `coverage` jobs below (issue #486) so
      # the suite fans out across runners instead of serialising behind lint
      # and build on both Node versions. This job's name is a required status
      # check, so it stays exactly as it was and keeps meaning "the backend
      # compiles and passes static analysis on Node X".

  # ── Sharded test fan-out (issue #486) ───────────────────────────────────
  # Three jobs replace the old `npm test` + `npm run test:e2e` pair:
  #   unit-tests  -> N Jest shards, each writing its own coverage + flake report
  #   e2e-tests   -> M Jest shards against the migrated Postgres service
  #   coverage    -> merges the shard reports and enforces the 70% gate
  #
  # fail-fast is off on both matrices on purpose: with it on, the first failing
  # shard cancels its siblings, their coverage artifacts are never uploaded,
  # and the merge job reports "a shard never wrote its report" instead of the
  # real failure. Every shard has to finish so the coverage merge is complete.

  unit-tests:
    name: Unit tests (shard ${{ matrix.shard }}/${{ matrix.shard-total }})
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        shard-total: [4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex
          POSTGRES_DB: vortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vortex"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://vortex:vortex@localhost:5432/vortex?schema=public
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Tests run on the lowest supported Node only. Running the same 35
          # spec files on 20 and 22 doubles CI minutes to re-test runtime
          # behaviour the build job already proves compiles on both; the
          # version-specific risk is a native module, which `npm run build`
          # loads on both anyway.
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same Prisma client cache as the backend job: generate-and-migrate is
      # the slowest fixed cost in a test shard, and the key is content-addressed
      # so a schema or lockfile change invalidates it on its own.
      - name: Restore cached Prisma client
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules/.prisma
          key: prisma-${{ runner.os }}-node20-${{ hashFiles('prisma/schema.prisma', 'package-lock.json') }}

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run database migrations
        run: npm run db:migrate:prod

      # run-tests.mjs applies test/quarantine.json, writes the shard's
      # Istanbul report to its own directory (so shards cannot clobber each
      # other), and retries only the failing files to separate a flake from a
      # real failure.
      - name: Run unit test shard
        run: >-
          node scripts/ci/run-tests.mjs
          --suite=unit
          --shard=${{ matrix.shard }}/${{ matrix.shard-total }}
          --out-dir=ci-artifacts/unit-s${{ matrix.shard }}
          --coverage-dir=coverage-shards/unit-s${{ matrix.shard }}

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit-s${{ matrix.shard }}
          path: coverage-shards/unit-s${{ matrix.shard }}
          if-no-files-found: warn

      - name: Upload flake report and Jest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-s${{ matrix.shard }}-logs
          path: ci-artifacts/unit-s${{ matrix.shard }}
          if-no-files-found: warn

  e2e-tests:
    name: E2E tests (shard ${{ matrix.shard }}/${{ matrix.shard-total }})
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        shard-total: [2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex
          POSTGRES_DB: vortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vortex"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://vortex:vortex@localhost:5432/vortex?schema=public
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same Prisma client cache as the backend job: generate-and-migrate is
      # the slowest fixed cost in a test shard, and the key is content-addressed
      # so a schema or lockfile change invalidates it on its own.
      - name: Restore cached Prisma client
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules/.prisma
          key: prisma-${{ runner.os }}-node20-${{ hashFiles('prisma/schema.prisma', 'package-lock.json') }}

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run database migrations
        run: npm run db:migrate:prod

      # No --coverage-dir here. test/jest-e2e.json has no collectCoverageFrom,
      # so its coverage map has different file keys than the unit config's;
      # merging the two would trip the shard-consistency check in
      # coverage-merge.mjs. The coverage gate is measured on the unit shards,
      # which is also where nearly all of the code is exercised.
      - name: Run E2E test shard
        run: >-
          node scripts/ci/run-tests.mjs
          --suite=e2e
          --shard=${{ matrix.shard }}/${{ matrix.shard-total }}
          --out-dir=ci-artifacts/e2e-s${{ matrix.shard }}

      - name: Upload flake report and Jest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-s${{ matrix.shard }}-logs
          path: ci-artifacts/e2e-s${{ matrix.shard }}
          if-no-files-found: warn

  coverage:
    name: Coverage merge and gate
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Without merge-multiple, each artifact lands in its own subdirectory of
      # the target path, so the four shards arrive as
      # coverage-shards/coverage-unit-s1..4/coverage-final.json -- exactly the
      # one-directory-deep layout coverage-merge.mjs scans.
      - name: Download shard coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-unit-s*
          path: coverage-shards

      - name: Download flake reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-logs"
          path: ci-artifacts

      # The 70% gate is enforced here, on the union, and never per shard: a
      # shard that runs a ninth of the suite cannot meet a global threshold.
      # The threshold itself is read from jest.config.js, so this stays a single
      # definition rather than a second copy in the workflow.
      - name: Merge shard coverage and enforce threshold
        run: >-
          node scripts/ci/coverage-merge.mjs
          --shards=coverage-shards
          --out=coverage
          --expect-shards=4
          --title="Coverage (merged from 4 unit test shards)"

      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-merged
          path: coverage
          if-no-files-found: warn

  # Pure Node, no npm ci: the quarantine file is the one piece of test
  # infrastructure that can be validated before dependencies are installed, so
  # it is also usable as a pre-commit guard (scripts/ci/check-quarantine.mjs).
  test-hygiene:
    name: Quarantine file hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Fails on a missing owner/issue, a path that no longer exists, a
      # duplicate entry, or an entry older than staleAfterDays.
      - name: Validate test/quarantine.json
        run: node scripts/ci/check-quarantine.mjs

  # ── TLA+ model checking (issue #471) ─────────────────────────────────────
  # Bounded TLC run on changes to the spec or the canonical state machine.
  formal:
    name: TLA+ model check (TLC, bounded)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      (contains(join(github.event.pull_request.labels.*.name, ','), 'formal') ||
       true)
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Run TLC (bounded model)
        uses: docker://tlaplus/tlaplus:latest
        with:
          args: tlc -config formal/IntentLifecycle.cfg formal/IntentLifecycle.tla
      - name: Upload TLC output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tlc-output
          path: formal/*.out

  # ── Semgrep custom rules (issue #478) ────────────────────────────────────
  semgrep:
    name: Semgrep custom rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: .semgrep/rules
          error: true
      - name: Semgrep rule tests
        run: |
          pip install semgrep
          semgrep --test --config .semgrep/rules .semgrep/tests

  # ── Prometheus rules (issue #480) ────────────────────────────────────────
  promtool:
    name: promtool check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install promtool
        run: |
          curl -sL https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz | tar xz
          sudo mv prometheus-2.53.0.linux-amd64/promtool /usr/local/bin/
      - name: Check rules
        run: promtool check rules ops/prometheus/rules/vortex-slo.yml
      - name: Unit-test rules
        run: promtool test rules ops/prometheus/rules/vortex-slo_test.yml
      - name: Check rule file is also a valid Prometheus config fragment
        run: promtool check config ops/prometheus/prometheus.yml

  # ── Grafana dashboards (issue #481) ───────────────────────────────────────
  # Two things are checked, neither of which needs a Grafana instance:
  #   1. build.mjs --check proves the committed dashboard JSON is exactly what
  #      the generator produces, so a hand-edited panel cannot drift.
  #   2. validate.mjs proves the panels are usable: every recording rule and
  #      metric a panel names exists, every panel has a legend, description,
  #      unit and threshold set, no panel reintroduces a multi-day
  #      histogram_quantile, and every alert links to a dashboard that exists.
  #
  # Both are plain Node with no dependencies, which is the whole point of
  # generating the JSON ourselves instead of adding grafonnet to the toolchain.
  grafana:
    name: Grafana dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Generated dashboards are in sync with build.mjs
        run: node ops/grafana/build.mjs --check

      - name: Validate dashboards, panels and alert links
        run: node ops/grafana/validate.mjs

      - name: Validate the observability Compose profile
        run: docker compose --profile observability config --quiet

      - name: Upload dashboards for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grafana-dashboards
          path: ops/grafana/dashboards

  # ── Migration rollback verification ────────────────────────────────────────
  # For every prisma/migrations/*/down.sql, applies migration.sql then
  # down.sql against a fresh Postgres and asserts the schema returns to its
  # pre-migration (empty) state. See prisma/migrations/README.md.
  migration-rollback:
    name: Migration rollback verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex
          POSTGRES_DB: vortex_rollback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: vortex
      PGPASSWORD: vortex
      PGDATABASE: vortex_rollback_test
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Apply each migration's up then down script and verify schema is restored
        run: |
          set -euo pipefail
          for dir in prisma/migrations/*/; do
            name=$(basename "$dir")
            up="$dir/migration.sql"
            down="$dir/down.sql"
            [ -f "$down" ] || continue

            echo "::group::$name"
            before=$(psql -Atc "select tablename from pg_tables where schemaname='public' order by 1")
            psql -v ON_ERROR_STOP=1 -f "$up"
            psql -v ON_ERROR_STOP=1 -f "$down"
            after=$(psql -Atc "select tablename from pg_tables where schemaname='public' order by 1")

            if [ "$before" != "$after" ]; then
              echo "Schema after down.sql does not match pre-migration state for $name"
              echo "before: $before"
              echo "after:  $after"
              exit 1
            fi
            echo "::endgroup::"
          done

  # ── Migration lint ─────────────────────────────────────────────────────────
  # Blocks unsafe DDL in migrations this change adds or modifies: non-concurrent
  # index builds/drops, column type rewrites, NOT NULL without a default,
  # lock-heavy constraints, LOCK TABLE. Also requires a down.sql in every such
  # migration. Untouched migrations aren't linted, so older ones can't fail
  # retroactively. The rules and the `-- squawk-ignore` override are in
  # prisma/migrations/README.md.
  migration-lint:
    name: Migration lint (squawk)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the diff base below is always present.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts skips Prisma's engine download and the husky hook;
      # neither is needed here, and it keeps the job well under 2 minutes.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test the migration checker (fixtures)
        run: npm run test:scripts

      - name: Lint changed migrations
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Pull requests: GitHub checks out a merge commit whose first parent is
          # the base branch tip, so HEAD^1 is exactly "everything this PR adds".
          # Pushes: diff against the commit that was on the branch before the push.
          if [ "$EVENT_NAME" = "pull_request" ] || [ -z "$BEFORE_SHA" ] || [ -z "${BEFORE_SHA//0/}" ]; then
            base="HEAD^1"
          else
            base="$BEFORE_SHA"
          fi
          npm run check:migrations -- --base "$base"

  # ── Docker build verification (#131) ──────────────────────────────────────
  # Ensures every push that changes application code doesn't silently break
  # the Dockerfile. Image publishing to a registry can be wired up separately
  # once registry credentials are in place.
  docker:
    name: Docker – build verification
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          tags: vortex-backend:ci

  sdk-publish:
    name: Publish generated SDK
    runs-on: ubuntu-latest
    needs: [backend, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Regenerate client SDK
        run: npm run generate:client

      - name: Verify packaged SDK installs cleanly
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          npm init -y
          npm install --silent "$GITHUB_WORKSPACE/src/generated"
          npm install --silent typescript @types/node
          cat <<'TS' > index.ts
          import type { paths, components } from '@vortex-protocol/backend-sdk';

          type IntentList = paths['/api/v1/intents']['get'];
          type Intent = components['schemas']['Intent'];

          const fallback: Intent | undefined = undefined;
          void fallback;
          void IntentList;
          TS
          npx tsc --noEmit --moduleResolution node --module commonjs --target es2020 index.ts

      - name: Publish SDK to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm --prefix src/generated version "$version" --no-git-tag-version
          npm --prefix src/generated publish --access public
