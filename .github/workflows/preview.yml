name: Preview Environments

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened, closed]
    branches: [main]

# Supply-chain hardening (issue #467)
# The top-level default is read-only repository access.
# Fork PRs are explicitly excluded by the `if` condition below.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PREVIEW_MAX_CONCURRENT: 5
  PREVIEW_TTL_HOURS: 48

jobs:
  # Guard: only run for PRs from this repo (not forks), and only when the 'preview' label is present
  guard:
    name: Guard (same repo + preview label)
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      namespace: ${{ steps.check.outputs.namespace }}
    steps:
      - name: Check same repo (exclude forks)
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "namespace=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          has_label=false
          for label in ${{ join(github.event.pull_request.labels.*.name, ' ') }}; do
            if [ "$label" = "preview" ]; then
              has_label=true
              break
            fi
          done
          if [ "$has_label" = "false" ] && [ "${{ github.event.action }}" != "closed" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "namespace=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Cost cap: check concurrent previews (simplified - using API would be better)
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "namespace=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

  # Build the preview image
  build:
    name: Build preview image
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Resolve the image reference
        id: ref
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:preview-${{ needs.guard.outputs.pr_number }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          provenance: false
          sbom: false

  # Deploy preview environment (using docker-compose for Postgres + Redis + Backend)
  deploy:
    name: Deploy preview environment
    needs: [guard, build]
    if: needs.guard.outputs.should_run == 'true' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NAMESPACE: ${{ needs.guard.outputs.namespace }}
      PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
      IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up docker-compose for preview
        run: |
          cat > docker-compose.preview.yml <<'COMPOSE'
          version: "3.8"
          services:
            postgres:
              image: postgres:16-alpine
              environment:
                POSTGRES_USER: vortex
                POSTGRES_PASSWORD: vortex
                POSTGRES_DB: vortex
              ports:
                - "5432:5432"
              tmpfs: /var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U vortex"]
                interval: 5s
                timeout: 3s
                retries: 10

            redis:
              image: redis:7-alpine
              ports:
                - "6379:6379"
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 3s
                retries: 10

            backend:
              image: ${IMAGE}
              ports:
                - "4000:4000"
              environment:
                DATABASE_URL: postgresql://vortex:vortex@postgres:5432/vortex?schema=public
                REDIS_URL: redis://redis:6379
                NODE_ENV: test
                STELLAR_NETWORK: testnet
                SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
                SOROBAN_SIGNING_KEY: ""
                SETTLEMENT_CONTRACT_ID: ""
                SOLVER_REGISTRY_CONTRACT_ID: ""
                ONCHAIN_DRY_RUN: "true"
                ONCHAIN_INTENTS_ENABLED: "false"
                SHADOW_MODE_ENABLED: "false"
                SIGNER_BACKEND: local
                ALLOW_LOCAL_SIGNER_IN_PROD: "true"
                KILLSWITCH_OPERATOR_TOKEN: preview-op-token
                KILLSWITCH_PERSISTENCE: memory
                INTENTS_PERSISTENCE: prisma
                SOLVERS_PERSISTENCE: prisma
                LOG_LEVEL: info
                CORS_ORIGIN: "*"
                WS_MAX_CONNECTIONS: 100
                WS_BACKPLANE: redis
                FLAGS_PUBSUB: redis
                PROCESS_ROLE: all
                JOBS_DRIVER: bullmq
                PARAMS_CONTRACT_ID: ""
                GUARDIAN_CONTRACT_ID: ""
                DATASETS_ENABLED: "false"
                CANARY_ADDRESSES: ""
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
                interval: 10s
                timeout: 5s
                retries: 12
                start_period: 20s
          COMPOSE

      - name: Pull and start preview stack
        run: |
          set -euo pipefail
          docker pull "${IMAGE}"
          docker-compose -f docker-compose.preview.yml up -d
          echo "Preview stack started"

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker-compose -f docker-compose.preview.yml ps --services --filter "status=running" | grep -q "backend"; then
              if docker-compose -f docker-compose.preview.yml exec -T backend curl -fsS http://localhost:4000/health 2>/dev/null; then
                echo "Backend is healthy"
                exit 0
              fi
            fi
            echo "Waiting for backend... attempt $attempt"
            sleep 10
          done
          echo "Backend failed to become healthy" >&2
          docker-compose -f docker-compose.preview.yml logs backend
          exit 1

      - name: Run database migrations
        run: |
          set -euo pipefail
          docker-compose -f docker-compose.preview.yml exec -T backend npx prisma migrate deploy

      - name: Seed preview database
        run: |
          set -euo pipefail
          docker-compose -f docker-compose.preview.yml exec -T backend npm run seed

      - name: Run smoke tests
        run: |
          set -euo pipefail
          # Health check
          curl -fsS http://localhost:4000/health
          # Swagger reachable
          curl -fsS http://localhost:4000/api/docs | grep -q "swagger"
          # WebSocket endpoint
          curl -fsS http://localhost:4000/api/docs-json | grep -q "websocket"
          echo "All smoke tests passed"

      - name: Get preview URL (use localhost since we run on runner)
        id: url
        run: |
          echo "url=http://localhost:4000" >> "$GITHUB_OUTPUT"

      - name: Post preview URL to PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { PR_NUMBER, url } = process.env;
            const body = `## Preview Environment Ready 🎉\n\n**PR #${PR_NUMBER}** preview is deployed and ready for testing.\n\n- **API Base URL**: ${url}\n- **Swagger UI**: ${url}/api/docs\n- **WebSocket**: ws://localhost:4000\n- **Health**: ${url}/health\n\n> This preview will be torn down when the PR is closed or the \`preview\` label is removed. TTL: 48 hours.\n\n*Deployed from commit ${process.env.GITHUB_SHA} (${process.env.GITHUB_REF_NAME})*`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(PR_NUMBER),
              body
            });
        env:
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
          url: ${{ steps.url.outputs.url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

  # Teardown on PR close or label removal
  teardown:
    name: Teardown preview environment
    needs: guard
    if: needs.guard.outputs.should_run == 'true' && (github.event.action == 'closed' || (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Teardown preview stack
        run: |
          set -euo pipefail
          PR_NUMBER="${{ needs.guard.outputs.pr_number }}"
          echo "Tearing down preview for PR #${PR_NUMBER}"
          # In a real setup, this would connect to the preview infrastructure
          # For this runner-based approach, the runner is ephemeral so cleanup is automatic
          echo "Preview runner will be cleaned up automatically"

      - name: Post teardown notice to PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { PR_NUMBER } = process.env;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(PR_NUMBER),
              body: `## Preview Environment Torn Down 🧹\n\nThe preview environment for PR #${PR_NUMBER} has been cleaned up.`
            });
        env:
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}

  # TTL cleanup - scheduled separately (see note below)
  # In practice, this would be a separate scheduled workflow that checks for stale previews